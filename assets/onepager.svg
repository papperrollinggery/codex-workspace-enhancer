<g transform="translate(72 1344)" font-family="Microsoft YaHei, Segoe UI, sans-serif"><text x="0" y="0" fill="#F5F8FB" font-size="34" font-weight="800">一套增强，解决四个日常断点</text><g transform="translate(0 68)"><text x="0" y="28" fill="#2F88FA" font-size="26" font-weight="800">01</text><text x="70" y="28" fill="#F5F8FB" font-size="28" font-weight="750">侧栏不被替换</text><text x="70" y="68" fill="#8FA1B4" font-size="20">保留原生结构；固定入口不随滚轮漂移，也不盖住内容。</text><line x1="0" y1="104" x2="696" y2="104" stroke="#203246"/><text x="0" y="158" fill="#2F88FA" font-size="26" font-weight="800">02</text><text x="70" y="158" fill="#F5F8FB" font-size="28" font-weight="750">任务真正可续接</text><text x="70" y="198" fill="#8FA1B4" font-size="20">搜索、预览、项目上下文与本周剩余，从真实状态同步。</text></g><g transform="translate(760 68)"><text x="0" y="28" fill="#2F88FA" font-size="26" font-weight="800">03</text><text x="70" y="28" fill="#F5F8FB" font-size="28" font-weight="750">文件夹直接可操作</text><text x="70" y="68" fill="#8FA1B4" font-size="20">新建、改名、移动、撤销，以及项目内一键自动整理。</text><line x1="0" y1="104" x2="696" y2="104" stroke="#203246"/><text x="0" y="158" fill="#41D58B" font-size="26" font-weight="800">04</text><text x="70" y="158" fill="#F5F8FB" font-size="28" font-weight="750">本地、可逆、有边界</text><text x="70" y="198" fill="#8FA1B4" font-size="20">不上传对话，不改应用包；安装、更新和回滚只动自有目录。</text></g></g>
<g transform="translate(72 1696)" font-family="Microsoft YaHei, Segoe UI, sans-serif"><rect width="1456" height="88" rx="16" fill="#0D1C2A" stroke="#1D3955"/><text x="32" y="36" fill="#6DAEFF" font-size="18" font-weight="800" letter-spacing="1.5">BUILT FOR LONG WORK SESSIONS</text><text x="32" y="65" fill="#D9E4EF" font-size="20">有界缓存  ·  近屏加载  ·  过期响应拦截  ·  减少动态效果  ·  关闭即清理会话</text></g>
