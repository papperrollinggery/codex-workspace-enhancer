name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugin/codex-workspace-enhancer/package-lock.json

      - name: Install native plugin dependencies
        run: npm --prefix plugin/codex-workspace-enhancer ci

      - name: Verify hosted Chrome
        run: |
          "$CHROME_PATH" --version

      - name: Audit production dependencies
        run: npm --prefix plugin/codex-workspace-enhancer audit --omit=dev --audit-level=high

      - name: Run complete quality gate
        run: npm run quality

      - name: Confirm generated release is committed
        run: git diff --exit-code -- plugin/codex-workspace-enhancer/dist

      - name: Upload visual QA artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-workspace-qa
          path: plugin/codex-workspace-enhancer/artifacts/
          if-no-files-found: warn
