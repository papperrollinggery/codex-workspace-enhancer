version: 2
updates:
  - package-ecosystem: npm
    directory: /plugin/codex-workspace-enhancer
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      mcp-runtime:
        patterns:
          - "@modelcontextprotocol/*"
      browser-tooling:
        patterns:
          - "playwright"
          - "esbuild"
